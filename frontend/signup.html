<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - KioskAI</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        try {
            const token = localStorage.getItem('authToken');
            if (token && token.split('.').length === 3) {
                window.location.href = 'index.html';
            }
        } catch (e) { }
    </script>
</head>

<body class="auth-page">
    <!-- Floating Background Elements -->
    <div class="background-animation">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
        <div class="floating-orb orb-4"></div>
        <div class="mesh-gradient"></div>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand">
            <img src="kiosk-icon.svg" alt="KioskAI" style="width: 48px; height: 48px; margin-right: 12px;">
            <h1 class="brand-name">KioskAI</h1>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Create Your Kiosk AI Account</h2>
                <p class="auth-subtitle">Deploy your AI agent powered by Groq LLaMA 4 Scout</p>
            </div>

            <form class="auth-form" id="signupForm">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M10 10C12.7614 10 15 7.76142 15 5C15 2.23858 12.7614 0 10 0C7.23858 0 5 2.23858 5 5C5 7.76142 7.23858 10 10 10Z"
                                fill="currentColor" opacity="0.3" />
                            <path
                                d="M10 12C5.58172 12 2 14.6863 2 18C2 18.5523 2.44772 19 3 19H17C17.5523 19 18 18.5523 18 18C18 14.6863 14.4183 12 10 12Z"
                                fill="currentColor" opacity="0.3" />
                        </svg>
                        <input type="text" id="fullName" name="fullName" class="form-input" placeholder="John Doe"
                            required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M2 5C2 3.89543 2.89543 3 4 3H16C17.1046 3 18 3.89543 18 5V15C18 16.1046 17.1046 17 16 17H4C2.89543 17 2 16.1046 2 15V5Z"
                                fill="currentColor" opacity="0.3" />
                            <path d="M2 5L10 10L18 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="email" id="email" name="email" class="form-input" placeholder="you@business.com"
                            required>
                    </div>
                </div>

                <!-- Business Name -->
                <div class="form-group">
                    <label for="businessName" class="form-label">Business Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 7L10 3L17 7V17H3V7Z" fill="currentColor" opacity="0.3" />
                            <path d="M8 17V12H12V17" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <input type="text" id="businessName" name="businessName" class="form-input"
                            placeholder="Your Business Name" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <rect x="3" y="8" width="14" height="10" rx="2" fill="currentColor" opacity="0.3" />
                            <path d="M6 8V6C6 3.79086 7.79086 2 10 2C12.2091 2 14 3.79086 14 6V8" stroke="currentColor"
                                stroke-width="2" />
                        </svg>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Create a strong password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M10 7C8.34315 7 7 8.34315 7 10C7 11.6569 8.34315 13 10 13C11.6569 13 13 11.6569 13 10C13 8.34315 11.6569 7 10 7Z"
                                    fill="currentColor" opacity="0.3" />
                                <path d="M10 3C5 3 1 10 1 10C1 10 5 17 10 17C15 17 19 10 19 10C19 10 15 3 10 3Z"
                                    stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Enter a password</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-auth-primary">
                    <span>Create Account</span>
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </form>

            <!-- Footer Link -->
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Log in</a></p>
            </div>
        </div>

        <!-- Trust Indicators -->
        <div class="trust-indicators">
            <div class="trust-item">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 1L2 4V8C2 11.5 5 14.5 8 15C11 14.5 14 11.5 14 8V4L8 1Z" fill="currentColor"
                        opacity="0.3" />
                    <path d="M6 8L7.5 9.5L10 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span>Secure & Encrypted</span>
            </div>
            <div class="trust-item">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="6" fill="currentColor" opacity="0.3" />
                    <path d="M6 8L7.5 9.5L10 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span>14-Day Free Trial</span>
            </div>
            <div class="trust-item">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <rect x="2" y="4" width="12" height="10" rx="2" fill="currentColor" opacity="0.3" />
                    <path d="M2 7H14" stroke="currentColor" stroke-width="2" />
                </svg>
                <span>No Credit Card Required</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
